<!doctype html>
<html lang="pt-BR" class="h-full">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>tracker-indexer · painel</title>
    <link rel="icon" type="image/png" href="/admin/assets/logo.png" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@800;900&display=swap" rel="stylesheet" />
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <style type="text/tailwindcss">
      @theme {
        --font-sans: 'Inter', ui-sans-serif, system-ui, sans-serif;
        --font-brand: 'Nunito', ui-rounded, ui-sans-serif, system-ui, sans-serif;
        --color-brand: #12b76a;
        --animate-indeterminate: indeterminate 1.4s ease-in-out infinite;

        @keyframes indeterminate {
          from { transform: translateX(-100%); }
          to { transform: translateX(400%); }
        }
      }

      @layer components {
        .btn {
          @apply inline-flex items-center justify-center gap-2 rounded-lg px-3.5 py-2 text-sm font-medium
            whitespace-nowrap transition cursor-pointer disabled:cursor-not-allowed disabled:opacity-40
            focus-visible:outline-2 focus-visible:outline-offset-2 focus-visible:outline-indigo-500;
        }
        .btn-primary { @apply bg-indigo-600 text-white shadow-sm hover:bg-indigo-500 disabled:hover:bg-indigo-600; }
        .btn-secondary {
          @apply bg-white text-zinc-700 shadow-sm ring-1 ring-zinc-200 hover:bg-zinc-50
            dark:bg-zinc-900 dark:text-zinc-200 dark:ring-zinc-700 dark:hover:bg-zinc-800;
        }
        .btn-danger { @apply bg-rose-600 text-white shadow-sm hover:bg-rose-500; }
        .btn-ghost {
          @apply text-zinc-500 hover:bg-zinc-100 hover:text-zinc-900
            dark:text-zinc-400 dark:hover:bg-zinc-800 dark:hover:text-zinc-100;
        }
        .btn-icon { @apply p-2; }
        .card { @apply rounded-2xl bg-white shadow-sm ring-1 ring-zinc-200/80 dark:bg-zinc-900 dark:ring-zinc-800; }
        .input {
          @apply w-full rounded-lg bg-zinc-50 px-3 py-2 text-sm ring-1 ring-zinc-200 outline-none transition
            placeholder:text-zinc-400 focus:bg-white focus:ring-2 focus:ring-indigo-500
            dark:bg-zinc-950 dark:ring-zinc-700 dark:focus:bg-zinc-950;
        }
        .label { @apply text-sm font-medium text-zinc-800 dark:text-zinc-200; }
        .hint { @apply text-xs text-zinc-500 dark:text-zinc-400; }
        .eyebrow { @apply text-xs font-semibold tracking-wider text-zinc-500 uppercase dark:text-zinc-400; }
      }
    </style>
    <script type="module" src="/admin/main.js"></script>
  </head>

  <body class="min-h-full bg-zinc-50 font-sans text-zinc-900 antialiased dark:bg-zinc-950 dark:text-zinc-100">
    <div id="progress" class="fixed inset-x-0 top-0 z-50 h-0.5 overflow-hidden" hidden>
      <div class="h-full w-1/4 animate-indeterminate rounded-full bg-indigo-500"></div>
    </div>

    <header
      class="sticky top-0 z-40 border-b border-zinc-200/80 bg-white/80 backdrop-blur-md dark:border-zinc-800 dark:bg-zinc-950/80"
    >
      <div class="mx-auto flex max-w-7xl flex-wrap items-center gap-x-6 gap-y-3 px-5 py-3 sm:px-8 lg:px-10">
        <a href="#/" class="flex items-center gap-2.5" title="Painel">
          <img src="/admin/assets/logo.png" alt="" width="40" height="40" class="size-10 shrink-0 dark:rounded-xl dark:bg-zinc-100 dark:p-1" />
          <h1 class="font-brand text-xl leading-none font-black tracking-tight">
            <span class="text-zinc-800 dark:text-zinc-100">tracker-</span><span class="text-brand">indexer</span>
          </h1>
        </a>

        <span
          id="job-pill"
          class="inline-flex items-center gap-2 rounded-full bg-zinc-100 px-3 py-1 text-xs font-medium text-zinc-600 dark:bg-zinc-800 dark:text-zinc-300"
        >
          conectando…
        </span>

        <div id="header-actions" class="ml-auto flex flex-wrap items-center gap-2"></div>
      </div>
    </header>

    <main class="mx-auto max-w-7xl px-5 py-8 sm:px-8 lg:px-10">
      <div id="page-dashboard" class="space-y-10">
      <section id="overview" class="grid gap-4 sm:grid-cols-2 lg:grid-cols-3 xl:grid-cols-5"></section>

      <section>
        <div class="flex flex-wrap items-end justify-between gap-2">
          <div>
            <h2 class="text-lg font-semibold">Trackers</h2>
            <p class="text-sm text-zinc-500">Mudanças valem a partir da próxima execução.</p>
          </div>
          <span id="trackers-count" class="text-sm text-zinc-500"></span>
        </div>
        <ul id="trackers" class="card mt-4 divide-y divide-zinc-100 overflow-hidden dark:divide-zinc-800"></ul>
      </section>

      <section id="activity"></section>
      </div>

      <div id="page-settings" hidden></div>
      <div id="page-tracker" hidden></div>
    </main>

    <dialog
      id="auth-dialog"
      class="m-auto w-[min(26rem,92vw)] rounded-2xl bg-white p-0 text-inherit shadow-2xl backdrop:bg-zinc-950/50 backdrop:backdrop-blur-sm dark:bg-zinc-900"
    >
      <form method="dialog" id="auth-form" class="space-y-4 p-6">
        <div>
          <h2 class="text-base font-semibold">Acesso ao painel</h2>
          <p id="auth-message" class="mt-1 text-sm text-zinc-500"></p>
        </div>
        <label id="auth-token-field" class="block space-y-1.5">
          <span class="label">ADMIN_TOKEN</span>
          <input type="password" name="token" class="input" autocomplete="current-password" />
        </label>
        <div class="flex justify-end">
          <button class="btn btn-primary" value="submit">Entrar</button>
        </div>
      </form>
    </dialog>

    <div id="toast" class="pointer-events-none fixed right-4 bottom-4 z-50 flex flex-col items-end gap-2"></div>
  </body>
</html>
